version: '3.8'

services:
  # 1. MySQL 資料庫服務
  mysql:
    image: mysql:8.0
    container_name: spa-mysql
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: spa_db
    volumes:
      - mysql_data:/var/lib/mysql

  # 2. Redis 快取服務
  redis:
    image: redis:alpine
    container_name: spa-redis
    ports:
      - "6379:6379"

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.13.4
    container_name: spa-es
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
    ports:
      - "9200:9200"

volumes:
  mysql_data: